# Built with scikit-build-core: `pip install .` / `pip wheel .` run CMake with
# -DRILLFACET_BUILD_PYTHON=ON and install the extension, Dawn, the shaders and
# the fonts into the package. Dawn must already be built by
# scripts/build_dawn.sh (third_party/dawn); docker/verify.sh --wheel does the whole
# thing in a clean container. For development, build with plain CMake instead
# (docs/REFERENCE.md) and use PYTHONPATH=python.
[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.9"]
build-backend = "scikit_build_core.build"

[project]
name = "rillfacet"
version = "0.1.2"
description = "Real-time WebGPU (Dawn) 3D viewer for physics and RL simulation, native and in the browser"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kenny Chu", email = "kennychu@riec.tohoku.ac.jp" }]
keywords = ["webgpu", "dawn", "visualization", "3d", "viewer", "physics", "simulation", "reinforcement-learning", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
# The wheel carries Dawn, GLFW, ImGui, ... and fonts: their notices ship with it.
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]
# websockets >= 13 for websockets.asyncio.server (rillfacet.web.server).
dependencies = ["numpy", "websockets>=13"]

[project.urls]
Homepage = "https://github.com/kennychufk/rillfacet"
Repository = "https://github.com/kennychufk/rillfacet"
Issues = "https://github.com/kennychufk/rillfacet/issues"

[project.optional-dependencies]
# Needed to build the _rillfacet extension (CMake finds nanobind through
# `python -m nanobind --cmake_dir`); cmake/ninja only if the system's are older
# than CMake 3.24 or missing.
build = ["nanobind>=2.9", "cmake>=3.24", "ninja", "scikit-build-core>=0.11"]
test = ["pytest"]
# web/tools/golden.py (native-vs-browser frame diff).
tools = ["pillow", "matplotlib"]
# Optional: set_geometry / set_poses / recorder accept torch tensors (CUDA too).
torch = ["torch"]
# Camera rendering with Mitsuba 3 (rillfacet.render.mitsuba; needs CUDA).
mitsuba = ["mitsuba>=3.9", "torch", "pillow"]
# Embedded / image-file textures of rillfacet.assets meshes.
assets = ["pillow"]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
build-dir = "build/skbuild/{wheel_tag}"
wheel.packages = ["python/rillfacet"]
# Python >= 3.12: one abi3 wheel (cp312-abi3) for all later versions; 3.10 and 3.11 get their own.
wheel.py-api = "cp312"
