# Built with scikit-build-core: `pip install .` / `pip wheel .` run CMake with
# -DRILLFACET_BUILD_PYTHON=ON and install the extension, Dawn, the shaders and
# the fonts into the package. Dawn must already be built by
# scripts/build_dawn.sh (third_party/dawn); docker/verify.sh --wheel does the whole
# thing in a clean container. For development, build with plain CMake instead
# (README.md) and use PYTHONPATH=python.
[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "rillfacet"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
# The wheel carries Dawn, GLFW, ImGui, ... and fonts: their notices ship with it.
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]
# websockets >= 13 for websockets.asyncio.server (rillfacet.web.server).
dependencies = ["numpy", "websockets>=13"]

[project.optional-dependencies]
# Needed to build the _rillfacet extension (CMake finds pybind11 through
# `python -m pybind11 --cmakedir`); cmake/ninja only if the system's are older
# than CMake 3.24 or missing.
build = ["pybind11", "cmake>=3.24", "ninja", "scikit-build-core>=0.11"]
test = ["pytest"]
# web/tools/golden.py (native-vs-browser frame diff).
tools = ["pillow", "matplotlib"]
# Optional: set_geometry / set_poses / recorder accept torch tensors (CUDA too).
torch = ["torch"]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
build-dir = "build/skbuild/{wheel_tag}"
wheel.packages = ["python/rillfacet"]
