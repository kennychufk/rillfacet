# The extension is built by CMake (-DAVBD_VIZ_BUILD_PYTHON=ON) into
# python/avbd_viz/; this only makes the package importable:
#   pip install -e . --no-build-isolation
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "avbd-viz"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
avbd_viz = ["*.so"]
