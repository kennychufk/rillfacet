# Builds the manylinux_2_28 wheels (CPython 3.10-3.14) in Docker, tests them in
# clean Ubuntu / Debian / Fedora images, builds the macOS arm64 wheels (macOS 12+,
# Metal) and Windows x64 wheels (Windows 10+, D3D12) with cibuildwheel, and
# publishes them all to TestPyPI.
#   - every push / PR: build + test, wheels kept as a workflow artifact
#   - tag v*, or "Run workflow" by hand: also upload to TestPyPI
#   - tag v* only: then upload to PyPI, after TestPyPI succeeded
# Both indexes use trusted publishing (no token): this repository, the workflow
# file (wheels.yml) and the environment (testpypi / pypi) are registered as a
# publisher at https://test.pypi.org/manage/account/publishing/ and
# https://pypi.org/manage/account/publishing/. A version can be uploaded to PyPI
# only once: bump `version` in pyproject.toml before tagging.
name: wheels

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Same build context as docker/verify.sh (tracked + not-ignored files), so
      # the export below reuses the layers the tests just built.
      - name: Build wheels and test them in clean images
        run: docker/verify.sh --manylinux
      - name: Export the wheels
        run: |
          git ls-files -z --cached --others --exclude-standard | tar --null -T - -cf "$RUNNER_TEMP/ctx.tar"
          docker build --target manylinux-dist --output dist -f docker/Dockerfile - < "$RUNNER_TEMP/ctx.tar"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          pattern: wheels*
          merge-multiple: true
          path: dist/*.whl
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      # Dawn takes a long time to build: reuse it until the script changes.
      - uses: actions/cache@v4
        with:
          path: third_party/dawn
          key: dawn-macos-arm64-12.0-${{ hashFiles('scripts/build_dawn.sh') }}
      - name: Build Dawn
        run: test -f third_party/dawn/lib/cmake/Dawn/DawnConfig.cmake || scripts/build_dawn.sh
      - uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_MACOS: arm64
          # No GPU on hosted runners: only check that the wheel imports.
          CIBW_TEST_COMMAND: python -c "import rillfacet"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # MSVC and Ninja on PATH, for Dawn and for the wheel builds below.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: third_party/dawn
          key: dawn-windows-x64-${{ hashFiles('scripts/build_dawn.sh') }}
      - name: Build Dawn
        shell: bash
        run: test -f third_party/dawn/lib/cmake/Dawn/DawnConfig.cmake || scripts/build_dawn.sh
      - uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_TEST_COMMAND: python -c "import rillfacet"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-testpypi:
    needs: [build, build-macos, build-windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
